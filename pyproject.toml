[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "heirs-navigator"
version = "0.1.0"
description = "Cited, privacy-aware navigator for synthetic deceased-customer bank claims"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "chromadb>=1.0,<2",
  "rank-bm25>=0.2.2,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "PyMuPDF>=1.25,<2",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "streamlit>=1.45,<2",
  "structlog>=25,<27",
  "presidio-analyzer>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "hypothesis>=6,<7", "types-PyYAML>=6,<7"]

[project.scripts]
heirs = "heirs_navigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heirs_navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["heirs_navigator"]
ignore_missing_imports = true

